<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%umpire_logo.svg" />
    <title>UMPIRE — Universal Monitoring Plugin &amp; Incident Reporter</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('umpire-theme')
          var preference =
            stored === 'light' || stored === 'dark' || stored === 'system'
              ? stored
              : 'light'
          var dark =
            preference === 'dark' ||
            (preference !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
