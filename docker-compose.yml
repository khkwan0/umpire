services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s
    volumes:
      - ./data:/data
    environment:
      PORT: "3000"
      DATABASE_PATH: /data/monitor.sqlite
      BASE_PATH: ${BASE_PATH:-/}
      CHECK_TIMEOUT_MS: ${CHECK_TIMEOUT_MS:-10000}
      FCM_ANDROID_CHANNEL_ID: ${FCM_ANDROID_CHANNEL_ID:-}
      UMPIRE_ADMIN_USERNAME: ${UMPIRE_ADMIN_USERNAME:?UMPIRE_ADMIN_USERNAME is required}
      UMPIRE_ADMIN_PASSWORD: ${UMPIRE_ADMIN_PASSWORD:?UMPIRE_ADMIN_PASSWORD is required}
    networks:
      - monitor

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        BASE_PATH: ${BASE_PATH:-/}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8089}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - monitor

networks:
  monitor:
    driver: bridge
