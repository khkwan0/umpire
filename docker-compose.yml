services:
  api:
    build: ./api
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s
    volumes:
      - ./data:/data
      - ${FIREBASE_CREDENTIALS_PATH:-./firebase-service-account.json}:/run/secrets/firebase.json:ro
    environment:
      PORT: "3000"
      DATABASE_PATH: /data/monitor.sqlite
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
      CHECK_TIMEOUT_MS: ${CHECK_TIMEOUT_MS:-10000}
      FCM_ANDROID_CHANNEL_ID: ${FCM_ANDROID_CHANNEL_ID:-}
    networks:
      - monitor

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8089}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - monitor

networks:
  monitor:
    driver: bridge
